[project]
name = "qwen-assistant"
version = "0.1.0"
description = "AI-powered sysadmin assistant: collects system state via YAML profiles and analyzes it with a local Ollama model"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "typer>=0.9",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "httpx>=0.24",
    "rich>=13.0",
]

[project.scripts]
qwen = "qwen_assistant.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qwen_assistant"]
